[package]
name = "volna"
version = "0.1.0"
description = "Волна — Yandex Music client for Windows"
authors = ["griffoonchik"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
keyring = { version = "3", features = ["windows-native"] }
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
hex = "0.4"
cpal = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
