<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Волна</title>
  <style>
    @font-face {
      font-family: "Dela Gothic One";
      src: url("fonts/DelaGothicOne-Regular.ttf") format("truetype");
    }
    :root {
      --bg: #050506;
      --fg: #e9e9ec;
      --dim: #6b6b74;
      --accent: #c6ff00;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: var(--mono);
      overflow: hidden;
    }
    .app { display: none; grid-template-columns: 200px 1fr; height: 100vh; }
    body.signed-in .app { display: grid; }
    body.signed-in #auth { display: none; }
    nav { border-right: 1px solid #1a1a1f; padding: 20px 14px; display: flex; flex-direction: column; }
    .logo {
      font-family: "Dela Gothic One", var(--mono);
      font-size: 28px; color: var(--accent); margin: 0 0 24px;
    }
    nav a {
      display: block; padding: 8px 10px; color: var(--dim);
      text-decoration: none; cursor: pointer;
      transition: color .25s ease, transform .35s cubic-bezier(.2,.8,.2,1);
    }
    nav a:hover { color: var(--fg); transform: translateX(3px); }
    nav a.on { color: var(--accent); }
    .who { margin-top: auto; padding: 10px; color: var(--dim); font-size: 12px; }
    .who button {
      margin-top: 8px; background: none; border: 1px solid #2a2a31; color: var(--dim);
      font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer; border-radius: 0;
      transition: color .25s ease, border-color .25s ease;
    }
    .who button:hover { color: var(--fg); border-color: var(--fg); }
    main { padding: 28px 32px; overflow: auto; }
    .screen { display: none; animation: rise .45s cubic-bezier(.2,.8,.2,1); }
    .screen.on { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    h1 { font-family: "Dela Gothic One", var(--mono); font-weight: 400; font-size: 34px; margin: 0 0 8px; }
    .sub { color: var(--dim); margin: 0 0 24px; }

    #auth {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; padding: 24px; text-align: center;
    }
    #auth .logo { font-size: 56px; margin: 0; }
    #auth p { color: var(--dim); margin: 0; }
    #auth button {
      font: inherit; font-size: 15px; padding: 14px 28px; cursor: pointer;
      background: var(--accent); color: #050506; border: 0; border-radius: 0;
      transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
    }
    #auth button:hover { transform: scale(1.03); }
    #auth button:active { transform: scale(.97); }
    #auth button[disabled] { opacity: .4; cursor: default; transform: none; }
    #auth .error { color: #ff5c5c; min-height: 1.2em; font-size: 13px; }
  </style>
</head>
<body>
  <section id="auth">
    <p class="logo">ВОЛНА</p>
    <p>// только музыка. войди через яндекс</p>
    <button id="login">войти через яндекс</button>
    <div class="error" id="login-error"></div>
  </section>

  <div class="app">
    <nav>
      <p class="logo">ВОЛНА</p>
      <a data-screen="wave" class="on">моя волна</a>
      <a data-screen="library">коллекция</a>
      <a data-screen="search">поиск</a>
      <a data-screen="now">сейчас играет</a>
      <div class="who">
        <span id="who-name"></span>
        <div><button id="logout">выйти</button></div>
      </div>
    </nav>
    <main>
      <section class="screen on" id="wave"><h1>Моя волна</h1><p class="sub">// поток — итерация 6</p></section>
      <section class="screen" id="library"><h1>Коллекция</h1><p class="sub">// мне нравится | плейлисты — итерация 3</p></section>
      <section class="screen" id="search"><h1>Поиск</h1><p class="sub">// итерация 3</p></section>
      <section class="screen" id="now"><h1>Сейчас играет</h1><p class="sub">// итерации 7–8</p></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
